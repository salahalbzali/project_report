<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>مولّد تقرير المشروع</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;}
  :root{
    --navy:#1e3a8a;
    --navy-2:#2b4fbd;
    --ink:#16233d;
    --muted:#64748b;
    --line:#dbe3ee;
    --bg:#eef2f7;
    --accent:#0ea5e9;
    --danger:#dc2626;
  }
  html,body{margin:0;padding:0;}
  body{
    font-family:'Cairo',system-ui,-apple-system,'Segoe UI',Tahoma,sans-serif;
    background:var(--bg);
    color:var(--ink);
    line-height:1.75;
    padding:22px 14px 70px;
    -webkit-font-smoothing:antialiased;
  }

  /* ============ شريط الأدوات ============ */
  .toolbar{
    max-width:920px;margin:0 auto 16px;display:flex;gap:12px;align-items:center;
    justify-content:space-between;flex-wrap:wrap;
    background:#fff;border-radius:14px;padding:12px 16px;
    box-shadow:0 4px 18px rgba(30,58,138,.09);
    position:sticky;top:10px;z-index:60;
  }
  .brand{display:flex;align-items:center;gap:10px;font-weight:800;color:var(--navy);font-size:15px;}
  .brand .dot{width:10px;height:10px;border-radius:50%;background:var(--accent);}
  .actions{display:flex;gap:8px;flex-wrap:wrap;}
  .btn{
    font-family:inherit;font-size:14px;font-weight:700;border:none;border-radius:10px;
    padding:10px 18px;cursor:pointer;transition:.15s;background:#eef2f7;color:var(--navy);
  }
  .btn:hover{background:#e2e9f3;transform:translateY(-1px);}
  .btn.primary{background:var(--navy);color:#fff;box-shadow:0 4px 14px rgba(30,58,138,.25);}
  .btn.primary:hover{background:var(--navy-2);}
  .btn.danger{background:#fee2e2;color:var(--danger);}
  .btn.danger:hover{background:#fecaca;}
  .btn:disabled{opacity:.6;cursor:wait;transform:none;}

  .status{
    max-width:920px;margin:0 auto 14px;font-size:12.5px;color:var(--muted);
    display:flex;align-items:center;gap:8px;padding:0 6px;min-height:20px;
  }
  .status .ok{color:#059669;font-weight:700;}

  /* ============ ورقة التقرير ============ */
  .report{
    max-width:920px;margin:0 auto;background:#fff;border-radius:16px;
    padding:40px 44px 50px;
    box-shadow:0 10px 40px rgba(30,58,138,.10);
  }

  /* الغلاف */
  .cover{text-align:center;padding-bottom:26px;border-bottom:3px solid var(--navy);margin-bottom:30px;}
  .cover-kicker{
    display:inline-block;background:#eef2ff;color:var(--navy);font-weight:700;
    font-size:13px;letter-spacing:.5px;padding:5px 16px;border-radius:999px;margin-bottom:10px;
  }
  .cover .cover-title{
    width:100%;border:none;background:transparent;text-align:center;
    font-family:inherit;font-size:28px;font-weight:800;color:var(--navy);
    padding:6px 0 12px;border-bottom:2px dashed #c7d3e4;margin-bottom:18px;
  }
  .cover .cover-title:focus{outline:none;border-bottom-color:var(--accent);}
  .cover .cover-title::placeholder{color:#b9c6d8;font-weight:700;}

  .cover-meta{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;}
  .cover-meta .meta-item{
    background:#f7faff;border:1px solid var(--line);border-radius:12px;
    padding:10px 12px;text-align:center;
  }
  .meta-label{display:block;font-size:12px;color:var(--muted);font-weight:700;margin-bottom:2px;}
  .cover-meta .meta-item input{
    width:100%;border:none;background:transparent;text-align:center;
    font-family:inherit;font-size:14px;font-weight:700;color:var(--navy);
    padding:4px 0;border-radius:6px;
  }
  .cover-meta .meta-item input:focus{outline:none;background:#fff;box-shadow:0 0 0 2px rgba(14,165,233,.18);}

  /* الأقسام */
  .section{margin-bottom:32px;}
  .section-head{
    display:flex;align-items:center;gap:12px;margin-bottom:16px;
    padding-bottom:9px;border-bottom:2px solid var(--line);
  }
  .section-head .num{
    width:34px;height:34px;flex:0 0 34px;border-radius:10px;background:var(--navy);
    color:#fff;display:grid;place-items:center;font-weight:800;font-size:15px;
  }
  .section-head h2{margin:0;font-size:19px;color:var(--navy);font-weight:800;}

  .field{margin-bottom:15px;}
  .field label{
    display:block;font-size:13.5px;font-weight:700;color:var(--navy);margin-bottom:6px;
  }
  .hint{font-weight:400;color:var(--muted);font-size:12.5px;}

  input[type=text],input[type=date],input[type=url],textarea{
    width:100%;font-family:inherit;font-size:14.5px;color:var(--ink);
    background:#fbfcfe;border:1px solid var(--line);border-radius:10px;
    padding:10px 13px;transition:.15s;line-height:1.75;
  }
  textarea{resize:vertical;min-height:78px;overflow:hidden;}
  input:focus,textarea:focus{
    outline:none;border-color:var(--accent);background:#fff;
    box-shadow:0 0 0 3px rgba(14,165,233,.13);
  }
  ::placeholder{color:#a9b6c7;font-weight:400;}

  /* بطاقات التجارب */
  .exp-card{
    border:1px solid var(--line);border-right:4px solid var(--navy);
    border-radius:12px;padding:16px 18px 4px;margin-bottom:16px;background:#fcfdff;
  }
  .exp-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;}
  .exp-badge{font-weight:800;color:var(--navy);font-size:15px;}

  .icon-btn{
    font-family:inherit;font-size:12px;font-weight:700;cursor:pointer;
    background:#fff1f1;color:var(--danger);border:1px solid #fecaca;
    border-radius:8px;padding:4px 11px;transition:.15s;
  }
  .icon-btn:hover{background:#fee2e2;}

  /* المصادر */
  .source-row{display:grid;grid-template-columns:1.1fr 1.4fr auto;gap:9px;margin-bottom:9px;align-items:center;}

  /* التطوير المستقبلي */
  .future-row{display:grid;grid-template-columns:auto 1fr auto;gap:9px;margin-bottom:9px;align-items:center;}
  .future-row .bullet{color:var(--accent);font-size:16px;line-height:1;}

  .add-btn{
    width:100%;border:2px dashed #c7d3e4;background:#f7faff;color:var(--navy);
    border-radius:12px;padding:11px;font-family:inherit;font-weight:700;font-size:13.5px;
    cursor:pointer;transition:.15s;margin-top:2px;
  }
  .add-btn:hover{background:#eef5ff;border-color:var(--accent);}

  .summary-box{
    background:#f7faff;border:1px solid var(--line);border-right:4px solid var(--accent);
    border-radius:12px;padding:16px 18px 4px;
  }

  /* ============ إعدادات الطباعة ============ */
  @media print {
    @page { size: A4; margin: 15mm 12mm; }
    body { background: #fff !important; padding: 0 !important; font-size: 12pt; }
    .no-print { display: none !important; }
    .report {
      box-shadow: none !important; border-radius: 0 !important;
      max-width: 100% !important; padding: 0 !important; margin: 0 !important;
    }
    input, textarea {
      border: none !important; background: transparent !important;
      padding: 2px 0 !important; box-shadow: none !important;
      resize: none !important; overflow: visible !important;
      height: auto !important; min-height: auto !important;
      color: #000 !important; font-size: 11pt !important;
    }
    .cover-meta .meta-item { background: transparent !important; border: 1px solid #ccc !important; }
    .exp-card { background: transparent !important; border: 1px solid #ccc !important; }
    .summary-box { background: transparent !important; border: 1px solid #ccc !important; }
    .add-btn { display: none !important; }
    .section, .exp-card, .source-row, .future-row, .cover, .avoid-break {
      break-inside: avoid !important; page-break-inside: avoid !important;
    }
    .section-head { break-after: avoid !important; page-break-after: avoid !important; }
  }

  /* ============ الجوال ============ */
  @media (max-width:720px){
    .report{padding:26px 20px 36px;}
    .cover .cover-title{font-size:22px;}
    .cover-meta{grid-template-columns:1fr;}
    .source-row{grid-template-columns:1fr;}
    .source-row .icon-btn{width:100%;}
    .toolbar{position:static;}
  }
</style>
</head>
<body>

<!-- شريط الأدوات -->
<div class="toolbar no-print">
  <div class="brand"><span class="dot"></span> مولّد تقرير المشروع</div>
  <div class="actions">
    <button class="btn primary" id="btnPdf">⬇ تصدير PDF</button>
    <button class="btn danger" id="btnClear">مسح البيانات</button>
  </div>
</div>
<div class="status no-print" id="status">يُحفظ عملك تلقائيًا في هذا المتصفح.</div>

<!-- ============ ورقة التقرير ============ -->
<main class="report" id="report">

  <!-- الغلاف -->
  <section class="cover avoid-break">
    <div class="cover-kicker">تقرير المشروع</div>
    <input class="cover-title" type="text" data-static="projectName" placeholder="اسم المشروع">
    <div class="cover-meta">
      <div class="meta-item">
        <span class="meta-label">اسم الطالب</span>
        <input type="text" data-static="studentName" placeholder="الاسم الكامل">
      </div>
      <div class="meta-item">
        <span class="meta-label">التاريخ</span>
        <input type="date" data-static="date">
      </div>
      <div class="meta-item">
        <span class="meta-label">رابط المشروع</span>
        <input type="text" data-static="link" placeholder="https://...">
      </div>
    </div>
  </section>

  <!-- 1 -->
  <section class="section">
    <div class="section-head"><span class="num">1</span><h2>فهم المشكلة</h2></div>
    <div class="field">
      <label>ما المشكلة التي يحلها المشروع؟</label>
      <textarea data-static="problem" rows="3" placeholder="اكتب باختصار توضيح المشكلة والعقبة الأساسية التي يستهدفها المشروع"></textarea>
    </div>
    <div class="field">
      <label>ما البيانات أو المدخلات المستخدمة؟</label>
      <textarea data-static="data" rows="3" placeholder="اذكر مصادر البيانات، الأحجام، أساليب الجمع أو المدخلات المتوقعة"></textarea>
    </div>
    <div class="field">
      <label>ما الهدف النهائي؟</label>
      <textarea data-static="goal" rows="2" placeholder="حدّد المخرج النهائي المتوقع والنتيجة المستهدفة بدقة"></textarea>
    </div>
  </section>

  <!-- 2 -->
  <section class="section">
    <div class="section-head"><span class="num">2</span><h2>المنهجية والقرارات</h2></div>
    <div class="field">
      <label>ماذا فعلت؟</label>
      <textarea data-static="method" rows="3" placeholder="لخّص خطوات الحل والمراحل التنفيذية التي مر بها المشروع"></textarea>
    </div>
    <div class="field">
      <label>ما الأدوات أو الخوارزميات التي استخدمتها؟</label>
      <textarea data-static="tools" rows="2" placeholder="اذكر لغات البرمجة، المكتبات، الأطر، أو الخوارزميات المستعملة"></textarea>
    </div>
    <div class="field">
      <label>ما السبب وراء اختيارها؟</label>
      <textarea data-static="why" rows="2" placeholder="اشرح أهم القرارات التقنية ودوافع اختيار هذه الأدوات دون غيرها"></textarea>
    </div>
    <div class="field">
      <label>ما الصعوبة التي واجهتك؟ وكيف حللتها؟</label>
      <textarea data-static="difficulty" rows="3" placeholder="اذكر أبرز التحديات التقنية أو التنظيمية وكيفية التغلّب عليها"></textarea>
    </div>
  </section>

  <!-- 3 -->
  <section class="section">
    <div class="section-head"><span class="num">3</span><h2>التجارب</h2></div>
    <div id="expList"></div>
    <button type="button" class="add-btn no-print" id="addExp">＋ إضافة تجربة أخرى</button>
  </section>

  <!-- 4 -->
  <section class="section">
    <div class="section-head"><span class="num">4</span><h2>أهم النتائج</h2></div>
    <div class="field">
      <label>أهم النتائج</label>
      <textarea data-static="results" rows="3" placeholder="ضع المقاييس الرقمية، الجداول، أو الإحصاءات المهمة التي تم الوصول إليها"></textarea>
    </div>
    <div class="field">
      <label>ماذا تعني هذه النتائج؟</label>
      <textarea data-static="meaning" rows="2" placeholder="فسّر النتائج والأدلة التي تدعم استنتاجك العلمي أو التقني"></textarea>
    </div>
    <div class="field">
      <label>ما الذي نجح؟ وما الذي لم ينجح؟</label>
      <textarea data-static="success" rows="2" placeholder="تحليل موجز للجانب المشرق والجوانب التي تحتاج تحسينًا"></textarea>
    </div>
    <div class="field">
      <label>ما حدود النتائج؟</label>
      <textarea data-static="limits" rows="2" placeholder="حدّد ما تستطيع النتائج إثباته وما لا تستطيع"></textarea>
    </div>
  </section>

  <!-- 5 -->
  <section class="section">
    <div class="section-head"><span class="num">5</span><h2>التغيير والتحسين</h2></div>
    <div class="field">
      <label>ما التغيير أو التحسين الذي أجريته؟ ولماذا؟</label>
      <textarea data-static="change" rows="2" placeholder="اشرح التعديل الأساسي ومسوّغاته"></textarea>
    </div>
    <div class="field">
      <label>ماذا توقعت؟ وماذا حدث فعليًا؟</label>
      <textarea data-static="expected" rows="2" placeholder="قارن بين التوقع المبدئي والواقع الملموس"></textarea>
    </div>
    <div class="field">
      <label>هل ستحتفظ بالتغيير؟ ولماذا؟</label>
      <textarea data-static="keep" rows="2" placeholder="قرارك النهائي بشأن اعتماد التحسين مع تعليل السبب"></textarea>
    </div>
  </section>

  <!-- 6 -->
  <section class="section">
    <div class="section-head"><span class="num">6</span><h2>ما تعلمته والمصادر</h2></div>
    <div class="field">
      <label>أهم شيء تعلمته</label>
      <textarea data-static="learnedMost" rows="2" placeholder="اكتب أهم المعارف أو المهارات التي اكتسبتها"></textarea>
    </div>
    <div class="field">
      <label>أكثر شيء واجهت فيه صعوبة</label>
      <textarea data-static="hardest" rows="2" placeholder="اكتب العقبة الأكبر التي استهلكت جهدًا ووقتًا"></textarea>
    </div>
    <div class="field">
      <label>المصادر التي استخدمتها <span class="hint">— اسم المصدر + الرابط</span></label>
      <div id="srcList"></div>
      <button type="button" class="add-btn no-print" id="addSrc">＋ إضافة مصدر</button>
    </div>
    <div class="field" style="margin-top:15px;">
      <label>ماذا تعلمت من هذه المصادر؟</label>
      <textarea data-static="sourcesValue" rows="2" placeholder="اكتب باختصار القيمة المضافة من هذه المراجع"></textarea>
    </div>
  </section>

  <!-- 7 -->
  <section class="section">
    <div class="section-head"><span class="num">7</span><h2>التطوير المستقبلي</h2></div>
    <div class="field">
      <label>لو واصلت تطوير المشروع، ماذا ستفعل؟ <span class="hint">— وما السؤال الجديد الذي تريد الإجابة عنه؟</span></label>
      <div id="futList"></div>
      <button type="button" class="add-btn no-print" id="addFut">＋ إضافة بند</button>
    </div>
  </section>

  <!-- الخلاصة -->
  <section class="section avoid-break">
    <div class="section-head"><span class="num">✓</span><h2>الخلاصة</h2></div>
    <div class="summary-box">
      <div class="field">
        <label>لخّص المشكلة والحل وأهم نتيجة وما تعلمته في بضعة أسطر مكثفة وشاملة</label>
        <textarea data-static="summary" rows="5" placeholder="..."></textarea>
      </div>
    </div>
  </section>

</main>

<script>
(function () {
  "use strict";

  const KEY       = "project-report-v1";
  const expList   = document.getElementById("expList");
  const srcList   = document.getElementById("srcList");
  const futList   = document.getElementById("futList");
  const statusEl  = document.getElementById("status");
  let   saveTimer = null;

  /* ---------- التجارب ---------- */
  function addExperiment(data) {
    data = data || {};
    const card = document.createElement("div");
    card.className = "exp-card avoid-break";
    card.innerHTML = `
      <div class="exp-head">
        <span class="exp-badge">التجربة</span>
        <button type="button" class="icon-btn no-print" data-remove="exp">حذف ✕</button>
      </div>
      <div class="field">
        <label>الفرضية <span class="hint">— ماذا توقعت قبل البدء؟</span></label>
        <textarea data-key="hypothesis" rows="2" placeholder="اكتب توقعك المبدئي..."></textarea>
      </div>
      <div class="field">
        <label><span data-label="action">ما الذي فعلته؟</span> <span class="hint">— وصف الإجراء والتطبيق العملي</span></label>
        <textarea data-key="action" rows="2" placeholder="صف الخطوات العملية التي نفّذتها..."></textarea>
      </div>
      <div class="field">
        <label>النتيجة <span class="hint">— ماذا حدث بالتفصيل؟</span></label>
        <textarea data-key="result" rows="2" placeholder="سجّل ما حدث فعليًا..."></textarea>
      </div>
      <div class="field">
        <label>ماذا تعلمت؟ <span class="hint">— الاستنتاج المستفاد</span></label>
        <textarea data-key="learned" rows="2" placeholder="الدرس أو الاستنتاج من هذه التجربة..."></textarea>
      </div>`;
    expList.appendChild(card);
    card.querySelectorAll("[data-key]").forEach(function (f) {
      if (data[f.dataset.key]) f.value = data[f.dataset.key];
    });
    renumberExperiments();
  }

  function renumberExperiments() {
    Array.prototype.forEach.call(expList.children, function (card, i) {
      card.querySelector(".exp-badge").textContent = "التجربة " + (i + 1);
      const lbl = card.querySelector('[data-label="action"]');
      if (lbl) lbl.textContent = (i === 0) ? "ما الذي فعلته؟" : "ما الذي غيّرته؟";
    });
  }

  /* ---------- المصادر ---------- */
  function addSource(data) {
    data = data || {};
    const row = document.createElement("div");
    row.className = "source-row avoid-break";
    row.innerHTML = `
      <input type="text" data-skey="name" placeholder="اسم المصدر">
      <input type="text" data-skey="link" placeholder="الرابط (URL)">
      <button type="button" class="icon-btn no-print" data-remove="src">✕</button>`;
    srcList.appendChild(row);
    row.querySelector('[data-skey="name"]').value = data.name || "";
    row.querySelector('[data-skey="link"]').value = data.link || "";
  }

  /* ---------- التطوير المستقبلي ---------- */
  function addFuture(val) {
    const row = document.createElement("div");
    row.className = "future-row avoid-break";
    row.innerHTML = `
      <span class="bullet">◆</span>
      <input type="text" data-future placeholder="اكتب بندًا تطويريًا...">
      <button type="button" class="icon-btn no-print" data-remove="fut">✕</button>`;
    futList.appendChild(row);
    row.querySelector("[data-future]").value = val || "";
  }

  /* ---------- الجمع والحفظ ---------- */
  function collect() {
    const data = { static: {}, experiments: [], sources: [], future: [] };
    document.querySelectorAll("[data-static]").forEach(function (el) {
      data.static[el.dataset.static] = el.value;
    });
    document.querySelectorAll(".exp-card").forEach(function (card) {
      const o = {};
      card.querySelectorAll("[data-key]").forEach(function (f) { o[f.dataset.key] = f.value; });
      data.experiments.push(o);
    });
    document.querySelectorAll(".source-row").forEach(function (r) {
      data.sources.push({
        name: r.querySelector('[data-skey="name"]').value,
        link: r.querySelector('[data-skey="link"]').value
      });
    });
    document.querySelectorAll("[data-future]").forEach(function (i) {
      data.future.push(i.value);
    });
    return data;
  }

  function scheduleSave() {
    clearTimeout(saveTimer);
    saveTimer = setTimeout(save, 450);
  }

  function save() {
    try {
      localStorage.setItem(KEY, JSON.stringify(collect()));
      statusEl.innerHTML = '<span class="ok">✔ تم الحفظ تلقائيًا</span> — بياناتك محفوظة في هذا المتصفح.';
    } catch (e) {
      statusEl.textContent = "تعذّر الحفظ التلقائي في هذا المتصفح.";
    }
  }

  /* ---------- التحميل ---------- */
  function load() {
    let data = null;
    try { data = JSON.parse(localStorage.getItem(KEY)); } catch (e) { data = null; }

    if (!data) {
      addExperiment(); addExperiment();
      addSource();
      addFuture(); addFuture(); addFuture();
      return;
    }

    if (data.static) {
      document.querySelectorAll("[data-static]").forEach(function (el) {
        const v = data.static[el.dataset.static];
        if (typeof v === "string") el.value = v;
      });
    }

    const exps = (data.experiments && data.experiments.length) ? data.experiments : [{}, {}];
    exps.forEach(addExperiment);

    const srcs = (data.sources && data.sources.length) ? data.sources : [{}];
    srcs.forEach(addSource);

    const futs = (data.future && data.future.length) ? data.future : ["", "", ""];
    futs.forEach(addFuture);
  }

  /* ---------- الأحداث ---------- */
  document.addEventListener("input", function (e) {
    if (e.target.closest("#report")) scheduleSave();
  });

  document.getElementById("addExp").addEventListener("click", function () {
    addExperiment(); scheduleSave();
    expList.lastElementChild.scrollIntoView({ behavior: "smooth", block: "center" });
  });
  document.getElementById("addSrc").addEventListener("click", function () {
    addSource(); scheduleSave();
  });
  document.getElementById("addFut").addEventListener("click", function () {
    addFuture(); scheduleSave();
  });

  document.addEventListener("click", function (e) {
    const btn = e.target.closest("[data-remove]");
    if (!btn) return;
    const type = btn.dataset.remove;

    if (type === "exp") {
      if (expList.children.length <= 1) { alert("يجب أن تبقى تجربة واحدة على الأقل."); return; }
      btn.closest(".exp-card").remove();
      renumberExperiments();
    } else if (type === "src") {
      if (srcList.children.length <= 1) {
        srcList.querySelectorAll("input").forEach(function (i) { i.value = ""; });
      } else {
        btn.closest(".source-row").remove();
      }
    } else if (type === "fut") {
      if (futList.children.length <= 1) {
        futList.querySelector("[data-future]").value = "";
      } else {
        btn.closest(".future-row").remove();
      }
    }
    scheduleSave();
  });

  /* ---------- التصدير (الطباعة) ---------- */
  document.getElementById("btnPdf").addEventListener("click", function () {
    // إظهار رسالة توضيحية للمستخدم
    const originalText = statusEl.innerHTML;
    statusEl.innerHTML = '<span style="color:#0ea5e9;font-weight:700;">⏳ جارٍ تحضير الطباعة... اختر "حفظ كـ PDF" (Save as PDF) من نافذة الطباعة.</span>';
    
    // إخفاء شريط الأدوات مؤقتًا (CSS تفعل ذلك عبر @media print)
    setTimeout(function() {
      window.print();
      // إعادة الرسالة بعد الطباعة
      setTimeout(function() {
        statusEl.innerHTML = originalText;
      }, 1000);
    }, 500);
  });

  document.getElementById("btnClear").addEventListener("click", function () {
    if (!confirm("سيتم مسح جميع البيانات المدخلة نهائيًا. هل أنت متأكد؟")) return;
    try { localStorage.removeItem(KEY); } catch (e) {}
    location.reload();
  });

  /* ---------- التشغيل ---------- */
  load();
  scheduleSave();
})();
</script>
</body>
</html>
